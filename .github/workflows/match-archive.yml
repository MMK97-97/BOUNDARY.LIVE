name: Save CricClubs source snapshot (manual)
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: 'CricClubs Match ID'
        required: true
        default: '986'
      club_id:
        description: 'CricClubs Club ID'
        required: true
        default: '300'
permissions:
  contents: read
concurrency:
  group: mk97-source-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Fetch one whitelisted snapshot
        env:
          MK97_MATCH_ID: ${{ inputs.match_id }}
          MK97_CLUB_ID: ${{ inputs.club_id }}
          MK97_DATA_DIR: source-snapshot
        run: node scripts/archive-match.mjs
      - name: Keep source snapshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mk97-source-snapshot
          path: source-snapshot/*.json
          retention-days: 7

# Optional Docker deployment behind your existing HTTPS/WebSocket reverse proxy.
# Set these two values in the host's secret environment, never in Git.
services:
  mk97:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Set a random private token of at least 32 characters}
      PUBLIC_URL: ${PUBLIC_URL:?Set the exact public HTTPS origin}
      STUDIO_ENCRYPTION_KEY: ${STUDIO_ENCRYPTION_KEY:?Set and retain a private 32-byte encryption key}
      STUDIO_DATA_FILE: /appdata/studio.enc
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
    volumes:
      - studio_data:/appdata
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 15s
volumes:
  studio_data:

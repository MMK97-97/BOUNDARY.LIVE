# Run from this directory after creating its private .env file on the server.
services:
  mk97:
    build: ../..
    init: true
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Create .env with a random private access token}
      PUBLIC_URL: https://${PUBLIC_HOST:?Set your real DNS hostname in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      STUDIO_ENCRYPTION_KEY: ${STUDIO_ENCRYPTION_KEY:?Generate and retain a private 32-byte encryption key}
      STUDIO_DATA_FILE: /appdata/studio.enc
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
    volumes:
      - studio_data:/appdata
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 15s
  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set your real DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [mk97]
    security_opt: [no-new-privileges:true]
volumes:
  studio_data:
  caddy_data:
  caddy_config:
